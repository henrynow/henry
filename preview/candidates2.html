<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#F2F4F6;margin:0;padding:28px}
  h2{font-size:15px;margin:0 0 18px;color:#191F28}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .card{background:#fff;border-radius:16px;padding:18px 18px 14px}
  .lab{font-size:11px;font-weight:700;color:#8B95A1;letter-spacing:.02em;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .mk{border-radius:11px;background:linear-gradient(140deg,#2F80FF,#0066FF 60%,#0052D9);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,102,255,.30);flex:0 0 auto}
  .mk.lg{width:88px;height:88px;border-radius:26px}
  .mk.md{width:34px;height:34px}
  .mk.sm{width:24px;height:24px;border-radius:8px}
  .mk.lg svg{width:52px;height:52px}
  .mk.md svg{width:19px;height:19px}
  .mk.sm svg{width:14px;height:14px}
  .nm{font-size:20px;font-weight:800;letter-spacing:-.055em;color:#0B1220}
  .small{display:flex;gap:14px;align-items:center;padding-top:10px;border-top:1px solid #EDEFF1}
</style></head><body>
<h2>OneFlow — round 2</h2>
<div class="grid" id="grid"></div>
<script>
const S = (d,w=11,cap='round') => `<path d="${d}" fill="none" stroke="#fff" stroke-width="${w}" stroke-linecap="${cap}" stroke-linejoin="round"/>`;
const marks = {
 "J1 · gateway arch": S("M27 79V52a23 23 0 0 1 46 0v27"),
 "J2 · arch + wave through": S("M27 80V53a23 23 0 0 1 46 0v25",10)+S("M33 66c6 6 11 6 17 0s11-6 17 0",7),
 "J3 · wave under arch": S("M24 58a26 26 0 0 1 52 0",10)+S("M30 74c6-6 12-6 18 0s12 6 18 0",9),
 "K · confluence (two into one)": S("M22 30c13 0 18 9 22 19")+S("M22 70c13 0 18-9 22-19")+S("M44 49h36"),
 "L · double chevron": S("M34 26l24 24-24 24")+S("M56 26l24 24-24 24"),
 "M · single wave (bold)": S("M18 62c11-18 22-18 33 0s22 18 33 0",12),
 "N · asymmetric two waves": S("M18 44c11-15 22-15 33 0s22 15 33 0",11)+S("M24 70c9-10 18-10 27 0s18 10 27 0",7),
 "O · wave + horizon": S("M20 52c10-14 20-14 30 0s20 14 30 0",11)+S("M20 76h60",11),
 "P · ring, wave-cut bottom": `<path d="M50 22a28 28 0 1 1-20.4 47.4" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>`+S("M22 62c9-9 18-9 27 0s18 9 27 0",9),
 "Q · numeral one + flow": `<path d="M50 24v50" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>`+`<path d="M50 24 34 38" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>`+S("M20 78c10 0 16-8 22-8s12 8 22 8 12-6 16-6",8),
 "R · three flow lines": S("M22 34h56",9)+S("M30 52c8-8 16-8 24 0s14 6 18 2",9)+S("M22 70h40",9),
 "S · ripple arcs": `<path d="M22 62a28 28 0 0 1 56 0" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>`+`<path d="M38 76a12 12 0 0 1 24 0" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>`
};
const grid = document.getElementById('grid');
for (const [name, svg] of Object.entries(marks)) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="lab">${name}</div>
    <div class="row">
      <div class="mk lg"><svg viewBox="0 0 100 100">${svg}</svg></div>
      <div class="mk md"><svg viewBox="0 0 100 100">${svg}</svg></div>
      <div><div class="nm">원플로우</div></div>
    </div>
    <div class="small">
      <div class="mk sm"><svg viewBox="0 0 100 100">${svg}</svg></div>
      <div class="mk md"><svg viewBox="0 0 100 100">${svg}</svg></div>
      <span style="font-size:13px;color:#4E5968">ONEFLOW · 자동차 직수출</span>
    </div>`;
  grid.appendChild(card);
}
</script>
</body></html>
