<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<title>원플로우 검수 하네스</title>
<style>
  body{font-family:-apple-system,sans-serif;background:#E9ECF1;margin:0;padding:20px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
  .box{background:#fff;border-radius:10px;padding:8px}
  .cap{font-size:11px;font-weight:700;color:#4E5968;padding:2px 4px 6px}
  iframe{border:1px solid #D5DBE3;border-radius:6px;display:block;background:#fff}
  .wrap{overflow:hidden}
  .desk iframe{width:1440px;height:900px;transform:scale(.66);transform-origin:top left}
  .desk{width:950px;height:594px}
  .scroll{height:660px;overflow-y:hidden;overflow-x:hidden}
</style></head><body>
<div class="box"><div class="cap">MOBILE 360×660 — TOP</div><iframe id="f1" src="index.html" width="360" height="660"></iframe></div>
<div class="box"><div class="cap">MOBILE 360×660 — #price (시세 비교표)</div><iframe id="f2" src="index.html#price" width="360" height="660"></iframe></div>
<div class="box"><div class="cap">MOBILE 390×844 — #guide</div><iframe id="f3" src="index.html#guide" width="390" height="844"></iframe></div>
<div class="box"><div class="cap">MOBILE 360×660 — footer (bottom)</div><iframe id="f4" src="index.html" width="360" height="660" data-scroll="bottom"></iframe></div>
<div class="box"><div class="cap">DESKTOP 1440×900 (66%) — TOP</div><div class="wrap desk"><iframe id="f5" src="index.html" width="1440" height="900"></iframe></div></div>
<div class="box"><div class="cap">DESKTOP 1440×900 (66%) — #price</div><div class="wrap desk"><iframe id="f6" src="index.html#price" width="1440" height="900"></iframe></div></div>
<script>
document.getElementById('f4').addEventListener('load', function(){
  try { this.contentWindow.scrollTo(0, this.contentDocument.body.scrollHeight); } catch(e){}
});
</script>
</body></html>
