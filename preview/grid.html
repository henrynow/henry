<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<title>shots</title>
<style>
  html,body{margin:0;background:#dfe3e9;font-family:-apple-system,sans-serif}
  .box{position:absolute;overflow:hidden;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  .box iframe{border:0;display:block;transform-origin:top left}
  .lab{position:absolute;font:11px/1.3 -apple-system,sans-serif;color:#39414d;background:#fff;padding:2px 6px;border-radius:4px;z-index:5}
</style></head><body>
<div class="lab" style="left:10px;top:516px">B 390×844 #guide</div>
<div class="box" id="bB" style="left:10px;top:534px;width:227px;height:491px"></div>
<div class="lab" style="left:250px;top:516px">A 360×660 footer</div>
<div class="box" id="bA" style="left:250px;top:534px;width:274px;height:502px"></div>
<div class="lab" style="left:540px;top:516px">D 1440×900 #price</div>
<div class="box" id="bD" style="left:540px;top:534px;width:490px;height:307px"></div>
<div class="lab" style="left:10px;top:0">C 1440×900 top</div>
<div class="box" id="bC" style="left:10px;top:18px;width:490px;height:307px"></div>
<script>
function make(boxId, w, h, scale, action){
  const box = document.getElementById(boxId);
  const fr = document.createElement('iframe');
  fr.width = w; fr.height = h; fr.src = 'index.html';
  fr.style.transform = `scale(${scale})`;
  box.appendChild(fr);
  fr.addEventListener('load', () => setTimeout(() => {
    try{
      const cd = fr.contentDocument;
      cd.documentElement.style.scrollBehavior='auto';
      if (action === 'bottom') fr.contentWindow.scrollTo(0, cd.body.scrollHeight);
      else if (action) { const el = cd.querySelector(action); if (el) el.scrollIntoView({block:'start'}); }
    }catch(e){ box.style.background='red'; }
  }, 700));
}
make('bA', 360, 660, 0.76, 'bottom');
make('bB', 390, 844, 0.58, '#guide');
make('bC', 1440, 900, 0.34, '');
make('bD', 1440, 900, 0.34, '#price');
</script>
</body></html>
