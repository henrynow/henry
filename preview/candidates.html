<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#F2F4F6;margin:0;padding:28px}
  h2{font-size:15px;margin:0 0 18px;color:#191F28}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .card{background:#fff;border-radius:16px;padding:18px 18px 14px}
  .lab{font-size:11px;font-weight:700;color:#8B95A1;letter-spacing:.02em;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .mk{border-radius:11px;background:linear-gradient(140deg,#2F80FF,#0066FF 60%,#0052D9);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,102,255,.30);flex:0 0 auto}
  .mk.lg{width:88px;height:88px;border-radius:26px}
  .mk.md{width:34px;height:34px}
  .mk.sm{width:24px;height:24px;border-radius:8px}
  .mk.lg svg{width:52px;height:52px}
  .mk.md svg{width:19px;height:19px}
  .mk.sm svg{width:14px;height:14px}
  .nm{font-size:20px;font-weight:800;letter-spacing:-.055em;color:#0B1220}
  .small{display:flex;gap:14px;align-items:center;padding-top:10px;border-top:1px solid #EDEFF1}
  .onwhite{display:flex;gap:12px;align-items:center;background:#F2F4F6;border-radius:10px;padding:10px}
</style></head><body>
<h2>OneFlow mark candidates — 34px header / 24px / 88px</h2>
<div class="grid" id="grid"></div>
<script>
const marks = {
 "A · dual wave": `<path d="M19 41c10.5-12.5 21-12.5 31.5 0S71.5 53.5 82 41" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/><path d="M19 66c10.5-12.5 21-12.5 31.5 0S71.5 78.5 82 66" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>`,
 "B · gate + base": `<path d="M31 79V54a19 19 0 0 1 38 0v25" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 79h56" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>`,
 "C · ring + wave": `<circle cx="50" cy="50" r="24" fill="none" stroke="#fff" stroke-width="10"/><path d="M31 51c6.5-8 13-8 19 0s12.5 8 19 0" fill="none" stroke="#fff" stroke-width="8.5" stroke-linecap="round"/>`,
 "D · rising flow": `<path d="M20 70c11 0 17-7 22.5-16.5S55 35 69 35" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/><path d="M20 81h44" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>`,
 "E · gate + wave through": `<path d="M33 80V56a17 17 0 0 1 34 0v24" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 66c7-8 14-8 21 0s14 8 21 0 14-8 21 0" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>`,
 "F · single flow swoosh": `<path d="M18 62c0-13 11-24 24-24s24 11 24 24" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/><path d="M66 62v18" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>`,
 "G · wave + rising tail": `<path d="M18 63c10-13 20-13 30 0s20 13 30 0" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/><path d="M78 40V22" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/><path d="M66 34l12-12 12 12" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>`,
 "H · two-line stream": `<path d="M18 45h64" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/><path d="M18 68c8-9 16-9 24 0s16 9 24 0 12-6 16-6" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>`,
 "I · portal O": `<path d="M50 22a28 28 0 1 1-19.8 47.8" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/><path d="M50 40a10 10 0 1 0 10 10" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>`
};
const grid = document.getElementById('grid');
for (const [name, svg] of Object.entries(marks)) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="lab">${name}</div>
    <div class="row">
      <div class="mk lg"><svg viewBox="0 0 100 100">${svg}</svg></div>
      <div class="mk md"><svg viewBox="0 0 100 100">${svg}</svg></div>
      <div><div class="nm">원플로우</div></div>
    </div>
    <div class="small">
      <div class="mk sm"><svg viewBox="0 0 100 100">${svg}</svg></div>
      <div class="mk md"><svg viewBox="0 0 100 100">${svg}</svg></div>
      <span style="font-size:13px;color:#4E5968">ONEFLOW</span>
    </div>`;
  grid.appendChild(card);
}
</script>
</body></html>
