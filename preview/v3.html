<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<title>v3</title>
<style>
  html,body{margin:0;background:#dfe3e9;font-family:-apple-system,sans-serif}
  .box{position:absolute;overflow:hidden;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  .box iframe{border:0;display:block;transform-origin:top left}
  .lab{position:absolute;font:11px/1.3 -apple-system,sans-serif;color:#39414d;background:#fff;padding:2px 6px;border-radius:4px;z-index:5}
</style></head><body>
<div class="lab" style="left:10px;top:0">D-top 1440×900 @0.62</div>
<div class="box" id="d1" style="left:10px;top:18px;width:893px;height:558px"></div>
<div class="lab" style="left:10px;top:590px">A mobile 360 footer</div>
<div class="box" id="m1" style="left:10px;top:608px;width:274px;height:502px"></div>
<div class="lab" style="left:300px;top:590px">B mobile 390 #guide</div>
<div class="box" id="m2" style="left:300px;top:608px;width:227px;height:491px"></div>
<div class="lab" style="left:10px;top:1120px">E desktop footer</div>
<div class="box" id="d2" style="left:10px;top:1138px;width:893px;height:558px"></div>
<script>
function make(id,w,h,s,act){
  const b=document.getElementById(id);
  const f=document.createElement('iframe');
  f.width=w;f.height=h;f.src='index.html';f.setAttribute('aria-hidden','true');f.tabIndex=-1;
  f.style.transform=`scale(${s})`;b.appendChild(f);
  f.addEventListener('load',()=>setTimeout(()=>{try{
    const cd=f.contentDocument;cd.documentElement.style.scrollBehavior='auto';
    if(act==='bottom')f.contentWindow.scrollTo(0,cd.body.scrollHeight);
    else if(act){const el=cd.querySelector(act);if(el)el.scrollIntoView({block:'start'});}
  }catch(e){b.style.background='#f00';}},700));
}
make('d1',1440,900,0.62,'');
make('m1',360,660,0.76,'bottom');
make('m2',390,844,0.58,'#guide');
make('d2',1440,900,0.62,'bottom');
</script>
</body></html>
